<!DOCTYPE html>
<html>

<head>
    <title>Tailwind Chat Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div id="joinBox" class="bg-white shadow-xl rounded-xl p-8 w-96 text-center">

        <h2 class="text-2xl font-bold text-blue-600 mb-4">Join Chat Room</h2>

        <input id="room" class="w-full p-3 border rounded-lg mb-3" value="123" placeholder="Enter Room ID">

        <input id="username" class="w-full p-3 border rounded-lg mb-4" placeholder="Enter Username">

        <button onclick="joinRoom()"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-lg font-semibold">
            Join Room
        </button>
    </div>

    <div id="chatBox" class="hidden bg-white shadow-xl rounded-xl p-8 w-[500px]">

        <h3 id="roomTitle" class="text-xl font-bold text-gray-700 mb-4"></h3>

        <div id="emojiCountBox" class="bg-yellow-100 p-3 rounded-lg mb-4 text-sm text-gray-800 font-semibold">
            Emoji Counts Will Appear Here...
        </div>

        <ul id="messages" class="border h-72 overflow-y-auto p-3 rounded-lg space-y-2 bg-gray-50"></ul>

        <div class="flex mt-4 items-center gap-2">
            <input id="msg" class="flex-1 p-3 border rounded-lg" placeholder="Type message...">

            <button onclick="sendMessage()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg">
                Send
            </button>
        </div>

        <div class="flex gap-3 mt-4">
            <button onclick="sendEmoji('😂')" class="text-2xl">😂</button>
            <button onclick="sendEmoji('❤️')" class="text-2xl">❤️</button>
            <button onclick="sendEmoji('🔥')" class="text-2xl">🔥</button>
            <button onclick="sendEmoji('👍')" class="text-2xl">👍</button>
        </div>

        <button id="leaveBtn" onclick="leaveRoom()"
            class="mt-4 bg-red-600 hover:bg-red-700 text-white w-full py-2 rounded-lg">
            Leave Room
        </button>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();
        let roomName = "";
        let username = "";

        function joinRoom() {
            roomName = document.getElementById("room").value;
            username = document.getElementById("username").value;

            if (!roomName || !username) {
                alert("Enter room id & username!");
                return;
            }

            socket.emit("joinRoom", { username, room: roomName });

            document.getElementById("joinBox").classList.add("hidden");
            document.getElementById("chatBox").classList.remove("hidden");

            document.getElementById("roomTitle").innerText =
                `Room: ${roomName}`;
        }

        socket.on("message", (data) => {
            let li = document.createElement("li");
            li.className = "p-2 bg-white shadow rounded";
            li.textContent = `${data.user}: ${data.msg}`;
            document.getElementById("messages").appendChild(li);

            const messagesDiv = document.getElementById("messages");
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        // 🔥 Display emoji counts
        socket.on("emojiCountUpdate", (countObj) => {
            const box = document.getElementById("emojiCountBox");

            if (Object.keys(countObj).length === 0) {
                box.innerHTML = "No emojis sent yet.";
                return;
            }

            box.innerHTML = Object.entries(countObj)
                .map(([emoji, count]) => `${emoji} = ${count}`)
                .join(" • ");
        });

        function sendMessage() {
            let message = document.getElementById("msg").value;
            if (message.trim() === "") return;

            socket.emit("chatMessage", message);
            document.getElementById("msg").value = "";
        }

        function sendEmoji(emoji) {
            socket.emit("sendEmoji", emoji);
        }

        function leaveRoom() {
            socket.emit("leaveRoom");
            alert("You left the room!");

            document.getElementById("chatBox").classList.add("hidden");
            document.getElementById("joinBox").classList.remove("hidden");

            document.getElementById("messages").innerHTML = "";
            document.getElementById("room").value = "";
            document.getElementById("username").value = "";
        }
    </script>

</body>

</html>
